version: '3'
services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=neo_market
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5431:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neo_market"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-composed:
    image: minio/minio
    container_name: minio-composed
    restart: always
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console (Web UI)
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_SERVER_URL=http://localhost:9000
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Автоматическое создание бакета и настройка политики
  minio-init:
    image: minio/mc
    container_name: minio-init
    depends_on:
      minio-composed:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio-composed:9000 minioadmin minioadmin;
      mc mb myminio/media || true;
      mc anonymous set download myminio/media;
      exit 0;
      "

  django:
    build: .
    container_name: django
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=neo_market
      - DB_USER=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - SECRET_KEY=${SECRET_KEY}
      # Настройки S3 для Django внутри Docker
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_STORAGE_BUCKET_NAME=media
      - AWS_S3_ENDPOINT_URL=http://minio-composed:9000
    volumes:
      - .:/app
    ports:
      - 8010:8000
    depends_on:
      postgres:
        condition: service_healthy
      minio-composed:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput && 
             python manage.py runserver 0.0.0.0:8000"

volumes:
  postgres_data:
  minio_data: